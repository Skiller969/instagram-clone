<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Instagram-clone</title>
    <!-- google icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- google font  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Lobster&display=swap" rel="stylesheet">

</head>

<body>
    <!-- main insta -->
    <div class="main-insta">
        <!-- left-sider -->
        <div class="left-side">
                <div id="logo">Instagram</div>
                <div class="items"><span class="material-symbols-outlined">home</span>Home</div>
                <div class="items"><span class="material-symbols-outlined">search</span>Search</div>
                <div class="items"><span class="material-symbols-outlined">chat</span>Chat</div>
                <div class="items"><span class="material-symbols-outlined">favorite</span>Notifications</div>
                <div class="items"><span class="material-symbols-outlined">add_circle</span>Create</div>
                <div class="items"><span class="material-symbols-outlined">account_circle</span>profile</div>
                <div class="items"><span class="material-symbols-outlined">menu</span>Menu</div>

        </div>


        <!-- posts -->
        <div class="posts"></div>

        <!-- right-side -->
        <div class="suggestions"></div>
    </div>
</body>

</html>
